name: Release

# 打 tag 即发布：GitHub 自己编译并建 Release，把 APK 和 Magisk 模块挂上去。
#
#   git tag 3.9.0 && git push origin 3.9.0
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配置四个 secret
# （不配也能跑，只是产出的 APK 未签名，仅供检查）：
#
#   KEYSTORE_BASE64      密钥库文件的 base64（本机 debug 密钥即可，
#                        换新密钥会导致已安装版本无法覆盖升级）
#   KEYSTORE_PASSWORD    密钥库口令
#   KEY_ALIAS            密钥别名
#   KEY_PASSWORD         密钥口令
#
# 生成 KEYSTORE_BASE64：
#   base64 -i ~/.android/debug.keystore | pbcopy

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 准备签名密钥
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "没有配置 KEYSTORE_BASE64，本次产出未签名 APK（仅供检查，不能直接安装）"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: 编译正式版
        env:
          TALLY_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          TALLY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TALLY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TALLY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: 整理产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk \
             "out/Tally-${{ github.ref_name }}.apk" 2>/dev/null || \
          cp app/build/outputs/apk/release/*.apk "out/Tally-${{ github.ref_name }}.apk"
          cp tally-a11y-guard/tally-a11y-guard-*.zip out/ 2>/dev/null || true
          ls -lh out

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
          body: |
            **安装包**：`Tally-${{ github.ref_name }}.apk`

            **保活模块**（可选，需要 Root/Magisk）：`tally-a11y-guard-*.zip`
            —— 在 Magisk 里「从本地安装」，装完**必须重启一次**。

            升级安装可直接覆盖，数据不会丢（请使用同一签名密钥构建的包）。
