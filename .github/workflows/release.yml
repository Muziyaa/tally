name: Release

# 打 tag 即发布：GitHub 自己编译并建 Release，把 APK 和 Magisk 模块挂上去。
#
#   git tag 3.9.0 && git push origin 3.9.0
#
# 需要在仓库 Settings → Secrets and variables → Actions 里配置四个 secret：
#
#   KEYSTORE_BASE64      密钥库文件的 base64（本机 debug 密钥即可，
#                        换新密钥会导致已安装版本无法覆盖升级）
#   KEYSTORE_PASSWORD    密钥库口令
#   KEY_ALIAS            密钥别名
#   KEY_PASSWORD         密钥口令
#
# 生成 KEYSTORE_BASE64：
#   base64 -i ~/.android/debug.keystore | tr -d '\n' | pbcopy

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 准备签名密钥
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # 不启用 -e：每一步的退出码自己处理，避免 die 在没有任何信息的地方。
          # ::notice:: 会变成 annotation —— 不登录也能通过公开 API 读到，
          # 是排查这类"步骤失败但看不到日志"最方便的通道。
          raw_len=${#KEYSTORE_BASE64}
          echo "::notice::KEYSTORE_BASE64 原始长度=$raw_len"
          if [ "$raw_len" -eq 0 ]; then
            echo "::warning::没有配置 KEYSTORE_BASE64，本次产出未签名 APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "ksinfo=未配置 KEYSTORE_BASE64" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n')
          echo "::notice::去空白后长度=${#CLEAN}，首 16 字符=$(printf '%s' "$CLEAN" | cut -c1-16)，末 16 字符=$(printf '%s' "$CLEAN" | rev | cut -c1-16 | rev)"

          # base64 长度必须是 4 的倍数 —— 粘贴时丢一个字符就必然解码失败。
          # 单独检查一下，好给出比 "exit code 1" 有用得多的提示。
          if [ $(( ${#CLEAN} % 4 )) -ne 0 ]; then
            echo "::error::KEYSTORE_BASE64 长度为 ${#CLEAN}，不是 4 的倍数 —— 粘贴时丢了字符（正确值应为 3492）"
            echo "ksinfo=长度 ${#CLEAN} 非法（非 4 倍数）" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.keystore" 2> "$RUNNER_TEMP/b64.err"
          rc=$?
          echo "::notice::base64 -d 退出码=$rc，stderr=$(cat "$RUNNER_TEMP/b64.err" 2>/dev/null | head -c 200)"
          if [ "$rc" -ne 0 ]; then
            echo "::error::base64 解码失败（退出码 $rc），KEYSTORE_BASE64 内容有问题"
            echo "ksinfo=base64 解码失败" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          SIZE=$(wc -c < "$RUNNER_TEMP/release.keystore")
          echo "::notice::解码后 $SIZE 字节"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::解码结果仅 $SIZE 字节，KEYSTORE_BASE64 不完整"
            echo "ksinfo=解码仅 $SIZE 字节" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "::notice::开始校验密钥库，口令长度=${#KEYSTORE_PASSWORD}"
          KT=$(keytool -J-Duser.language=en -list -v -keystore "$RUNNER_TEMP/release.keystore" \
                 -storepass "$KEYSTORE_PASSWORD" 2>&1)
          ktrc=$?
          echo "::notice::keytool 退出码=$ktrc"
          if [ "$ktrc" -ne 0 ]; then
            echo "::error::密钥库打不开：$(printf '%s' "$KT" | head -c 300)"
            echo "ksinfo=密钥库打不开（口令不对？）" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          FP=$(printf '%s' "$KT" | grep -iE '^[[:space:]]*SHA-?256:' | head -1 \
               | sed 's/^[^:]*:[[:space:]]*//' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "::notice::密钥指纹=${FP:0:24}"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "ksinfo=已加载密钥，指纹 ${FP:0:16}" >> "$GITHUB_OUTPUT"

      - name: 编译正式版
        env:
          TALLY_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          TALLY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TALLY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TALLY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          echo "--- 构建产物 ---"
          ls -lh app/build/outputs/apk/release/

      - name: 整理产物
        id: collect
        run: |
          set -eu
          mkdir -p out
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "out/Tally-${{ github.ref_name }}.apk"
          for z in tally-a11y-guard/tally-a11y-guard-*.zip; do
            [ -f "$z" ] && cp "$z" out/
          done
          echo "--- 待上传 ---"
          ls -lh out
          echo "files=$(ls out | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: 留存构建产物（即使发布步骤出问题也能取到）
        uses: actions/upload-artifact@v4
        with:
          name: Tally-${{ github.ref_name }}
          path: out/*
          if-no-files-found: error

      - name: 组装 Release 说明
        id: notes
        run: |
          {
            echo "**安装包**：\`Tally-${{ github.ref_name }}.apk\`"
            echo ""
            echo "**保活模块**（可选，需要 Root/Magisk）：\`tally-a11y-guard-*.zip\`"
            echo "在 Magisk 里「从本地安装」，装完**必须重启一次**。"
            echo ""
            echo "升级安装可直接覆盖，数据不会丢（请使用同一签名密钥构建的包）。"
            echo ""
            echo "---"
            echo "<sub>构建诊断：ref=\`${{ github.ref_name }}\` · tag=\`${{ github.ref }}\` · "
            echo "签名=${{ steps.keystore.outputs.signed }}（${{ steps.keystore.outputs.ksinfo }}） · "
            echo "产物=\`${{ steps.collect.outputs.files }}\`</sub>"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: out/*
